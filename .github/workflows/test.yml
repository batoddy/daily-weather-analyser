name: Test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Gizli değerlerin tipleri .dev.vars'tan üretilir; CI'da örnek dosya yeterli
      - run: cp .dev.vars.example .dev.vars && npx wrangler types
      - run: npm run typecheck
      - run: npm test
